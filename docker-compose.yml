# 一键本地编排：后端(Spring Boot) + 前端(Nginx) + 数据库(PostgreSQL)
# 用法：
#   cp .env.example .env   # 按需修改 DB_PASSWORD / JWT_SECRET 等
#   docker compose up --build
# 前端访问 http://localhost:8081 ，后端 API 在 http://localhost:8080/api
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: urbantravel
      POSTGRES_USER: urbantravel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbantravel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/urbantravel
      DB_USERNAME: urbantravel
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-secret}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_BASE: ${AI_API_BASE:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      WEATHER_ENABLED: ${WEATHER_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
